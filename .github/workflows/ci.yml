name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node test-caches.mjs

  cla-check:
    name: CLA Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Verify CLA
        run: |
          echo "CLA verification is handled by the CLA Assistant bot."
          echo "If this is your first PR, please sign the CLA at:"
          echo "https://cla-assistant.io/androvonx95/lambda128"
          echo ""
          echo "You can also sign by including 'Signed-off-by: Your Name <email>' in your commits."
