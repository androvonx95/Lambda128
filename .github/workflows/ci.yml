name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: node test-caches.mjs

  # ---------------------------------------------------------------------------
  # DCO Check — verify Signed-off-by on PR commits
  # ---------------------------------------------------------------------------
  dco-check:
    name: DCO Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check Signed-off-by
        run: |
          echo "Checking commits for Signed-off-by trailer..."
          FAILED=0
          for commit in $(git rev-list origin/${{ github.base_ref }}..HEAD); do
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' $commit | grep -q '@'; then
              echo "❌ Commit $commit is missing Signed-off-by"
              git log -1 --oneline $commit
              FAILED=1
            fi
          done
          if [ $FAILED -eq 1 ]; then
            echo ""
            echo "All commits must include a Signed-off-by line."
            echo "See CLA.md for details."
            exit 1
          fi
          echo "✅ All commits have Signed-off-by"

  # ---------------------------------------------------------------------------
  # Desktop App — Cross-Platform Build
  # ---------------------------------------------------------------------------
  desktop-linux:
    name: Desktop (Linux)
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: cd packages/desktop && npx electron-builder --linux AppImage deb --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lambda128-linux
          path: |
            packages/desktop/release/*.AppImage
            packages/desktop/release/*.deb

  desktop-macos:
    name: Desktop (macOS)
    runs-on: macos-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: pip3 install --break-system-packages setuptools
      - run: cd packages/desktop && npx electron-builder --mac dmg --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: lambda128-macos
          path: packages/desktop/release/*.dmg

  desktop-windows:
    name: Desktop (Windows)
    runs-on: windows-latest
    needs: build-and-test
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - run: cd packages/desktop && npx electron-builder --win nsis --publish never
        env:
          npm_config_msvs_version: "2022"
      - uses: actions/upload-artifact@v4
        with:
          name: lambda128-windows
          path: packages/desktop/release/*.exe

  # ---------------------------------------------------------------------------
  # GitHub Release (on tag push)
  # ---------------------------------------------------------------------------
  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [desktop-linux, desktop-macos, desktop-windows]
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lambda128-*
          path: release-artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -la release-artifacts/

      - uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/*
          generate_release_notes: true
          draft: false

